name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: codasaurus

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    outputs:
      archive: ${{ steps.package.outputs.archive }}
      archive_sha: ${{ steps.package.outputs.archive_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codasaurus-release-${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install cross-compiler (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build dashboard
        run: |
          cd codasaurus-frontend
          npm ci
          npm run build
          mkdir -p "$GITHUB_WORKSPACE/svelte-dashboard"
          cp -r dist "$GITHUB_WORKSPACE/svelte-dashboard/dist"

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare staging directory
        run: |
          staging="${{ env.BINARY_NAME }}-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$staging"
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} "$staging/"
          cp README.md LICENSE "$staging/"
          cp -r svelte-dashboard "$staging/"
          echo "$staging"

      - name: Package archive
        id: package
        run: |
          staging="${{ env.BINARY_NAME }}-${{ github.ref_name }}-${{ matrix.target }}"
          archive="${staging}.tar.gz"
          tar czf "$archive" "$staging/"
          sha=$(sha256sum "$archive" | cut -d' ' -f1)
          echo "$sha" > "${archive}.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "archive_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-archive-${{ matrix.target }}
          path: ${{ env.BINARY_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz*

  create-release:
    name: Create Release
    needs: [build-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-archive-*
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "$BINARY_NAME"-*.tar.gz* --clobber

