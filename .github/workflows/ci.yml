name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codasaurus
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codasaurus
          POSTGRES_PASSWORD: codasaurus
          POSTGRES_DB: codasaurus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codasaurus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://codasaurus:codasaurus@127.0.0.1:5432/codasaurus
      CODASAURUS_TEST_DATABASE_URL: postgres://codasaurus:codasaurus@127.0.0.1:5432/codasaurus
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codasaurus
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies
        # RUSTSEC-2023-0071 (rsa / Marvin Attack): no patched rsa release yet.
        # Pulled in via jsonwebtoken for GitHub App JWT minting. Exploit needs a
        # remote timing oracle against RSA private-key ops; signing here is
        # local/low-volume. Revisit when upstream ships a fix or we migrate crypto.
        # RUSTSEC-2026-0459 (SQLite WAL memory disclosure): libsqlite3-sys is
        # only locked as an optional sqlx sqlite dependency. The binary is built
        # with the postgres feature, so no SQLite code is linked.
        # RUSTSEC-2026-0387 (crypto-bigint timing variability): pulled in via
        # jsonwebtoken's p256/p384 support. This app mints RS256 only and never
        # runs P-256/P-384 operations, so the affected code paths are unreachable.
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0459 --ignore RUSTSEC-2026-0387
      - name: Run tests
        run: cargo test --locked

  cargo-deny:
    name: License / Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Check licenses and bans
        run: cargo-deny check licenses bans sources

  actionlint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codasaurus
      - name: Build
        run: cargo build --release --locked
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: codasaurus
          path: target/release/codasaurus

  dco:
    name: DCO
    # release-please commits are generated; they are not authored by a person
    # who can add a sign-off.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'app/github-actions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Every commit carries a Signed-off-by
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}" --no-tags
          base=$(git merge-base HEAD FETCH_HEAD)
          missing=0
          for sha in $(git rev-list "$base..HEAD" --no-merges); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $sha is missing a Signed-off-by line"
              missing=1
            fi
          done
          exit $missing

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codasaurus-frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: codasaurus-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
