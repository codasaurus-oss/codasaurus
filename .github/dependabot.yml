version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: quarterly
    open-pull-requests-limit: 2
    # Majors need code changes; handle them deliberately instead of keeping a
    # standing queue of PRs. Security updates are unaffected.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-updates:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: quarterly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-updates:
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: quarterly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      docker-updates:
        update-types: ["minor", "patch"]
    labels:
      - dependencies
      - docker
