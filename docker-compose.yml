services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg19-trixie
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: codasaurus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codasaurus}
      POSTGRES_DB: codasaurus
    volumes:
      # PG18+ keeps PGDATA under /var/lib/postgresql/<major>/docker. Mounting
      # /var/lib/postgresql/data would put data in an anonymous volume.
      - codasaurus-pg:/var/lib/postgresql
      - ./docker/litellm-init.sql:/docker-entrypoint-initdb.d/01-litellm.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codasaurus"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Optional local identity provider. Enable with:
  #   docker compose --profile identity up -d
  # Production deployments should set ZITADEL_DOMAIN, TLS, and all secrets in
  # an external environment file before enabling this profile.
  zitadel:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.20.2}
    profiles: [identity]
    command:
      - start-from-init
      - --masterkey
      - ${ZITADEL_MASTERKEY:-codasaurus-zitadel-masterkey-32!}
      - --tlsMode
      - disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://codasaurus:${POSTGRES_PASSWORD:-codasaurus}@postgres:5432/zitadel?sslmode=disable
      ZITADEL_EXTERNALSECURE: ${ZITADEL_EXTERNALSECURE:-false}
      ZITADEL_EXTERNALPORT: ${ZITADEL_EXTERNALPORT:-8080}
      ZITADEL_DOMAIN: ${ZITADEL_DOMAIN:-localhost}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME:-zitadel-admin@zitadel.localhost}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD:-LocalDevZitadel1!}
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ${ZITADEL_FIRSTINSTANCE_ORG_NAME:-Codasaurus}
    ports:
      - "127.0.0.1:${ZITADEL_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  litellm-migrate:
    image: ghcr.io/berriai/litellm:v1.110.2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /app/.venv/bin/prisma migrate deploy --schema /app/.venv/lib/python*/site-packages/litellm_proxy_extras/schema.prisma
    environment:
      - DATABASE_URL=${LITELLM_DATABASE_URL:?required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  litellm:
    image: ghcr.io/berriai/litellm:v1.110.2
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      - LITELLM_MODE=PRODUCTION
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?required}
      - STORE_MODEL_IN_DB=True
      - DATABASE_URL=${LITELLM_DATABASE_URL:?required}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY:?required}
      # Provider credentials and models are configured through Codasaurus
      # onboarding / Settings → LLM, not in the mounted gateway config.
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    depends_on:
      litellm-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:4000/health/readiness')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  codasaurus:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgres://codasaurus:${POSTGRES_PASSWORD:-codasaurus}@postgres:5432/codasaurus
      # Required to create the first owner on an empty database.
      - CODASAURUS_BOOTSTRAP_SECRET=${CODASAURUS_BOOTSTRAP_SECRET:-}
      - REDIS_URL=redis://redis:6379
      - CODASAURUS_TRUSTED_PROXIES=${CODASAURUS_TRUSTED_PROXIES:-127.0.0.0/8,::1/128}
      - CODASAURUS_DATA_DIR=/data
      - PORT=3000
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_PRIVATE_KEY_B64=${GITHUB_APP_PRIVATE_KEY_B64:-}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - CODASAURUS_MODEL=${CODASAURUS_MODEL:-}
      - CODASAURUS_MODEL_CHEAP=${CODASAURUS_MODEL_CHEAP:-}
      - CODASAURUS_EMBEDDING_MODEL=${CODASAURUS_EMBEDDING_MODEL:-}
      - CODASAURUS_BASE_URL=http://litellm:4000/v1
      # Admin credential for gateway management APIs; never used for inference.
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?required}
      - CODASAURUS_MAX_CONCURRENT_REVIEWS=${CODASAURUS_MAX_CONCURRENT_REVIEWS:-4}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - CODASAURUS_AUTH_MODE=${CODASAURUS_AUTH_MODE:-local}
      - ZITADEL_ISSUER=${ZITADEL_ISSUER:-}
      - ZITADEL_CLIENT_ID=${ZITADEL_CLIENT_ID:-}
      - ZITADEL_CLIENT_SECRET=${ZITADEL_CLIENT_SECRET:-}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - JIRA_BASE_URL=${JIRA_BASE_URL:-}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - LINEAR_API_KEY=${LINEAR_API_KEY:-}
    volumes:
      - codasaurus-data:/data
    tmpfs:
      - /tmp:size=64M,mode=1777
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        # The app fails closed without a gateway, so a sidecar that is still
        # booting (or misconfigured) must not block the dashboard and webhook.
        condition: service_started
    healthcheck:
      test: ["CMD", "codasaurus", "health", "--ready"]
      interval: 30s
      # Keep above the CLI's own 5s HTTP timeout to avoid false "unhealthy".
      timeout: 10s
      start_period: 90s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

volumes:
  codasaurus-data:
  codasaurus-pg:
